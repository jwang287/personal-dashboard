<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=./website2_observer.html">
    <title>个人仪表板 | Personal Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        .links {
            display: grid;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }
        .link-btn {
            display: block;
            padding: 1rem 2rem;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .link-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
        .link-btn.primary {
            background: rgba(255,215,0,0.3);
            border-color: rgba(255,215,0,0.5);
        }
        .link-btn.primary:hover {
            background: rgba(255,215,0,0.4);
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #10b981;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }
        .loading {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 个人仪表板</h1>
        <p>选择要访问的应用</p>
        
        <div class="links">
            <a href="./website2_observer.html" class="link-btn primary">
                🔶 金属与科技观察 <span class="badge">推荐</span>
            </a>
            <a href="./website1_dashboard.html" class="link-btn">
                📊 Tech News Dashboard
            </a>
            <a href="./todos.html" class="link-btn">
                ✅ 待办事项应用
            </a>
        </div>
        
        <div class="loading">
            <span class="spinner"></span>
            3秒后自动跳转至推荐版本...
        </div>
    </div>
    
    <script>
        // Auto redirect after 3 seconds
        setTimeout(() => {
            window.location.href = './website2_observer.html';
        }, 3000);
    </script>
</body>
</html>
